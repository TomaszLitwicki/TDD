<html>
	<head>
		<title>To-Do lists</title>
		<style>
    		table, th, td {
      			border: 1px solid black;   /* Czarne linie siatki */
      			border-collapse: collapse; /* Pojedyncze linie zamiast podwójnych */
      			padding: 6px;              /* Minimalny odstęp tekst-ramka */
			    }
  		</style>
	</head>
	<body>
		<h1>Your To-Do list.</h1>
		<form method="POST" action="/lists/{{ list.id }}/add_item">
			<input name="item_text" id="id_new_element" placeholder="Enter a to-do item"/>
			{% csrf_token %}
		</form>
		<table id="id_list_table">
			{% for item in items %}
				<tr><td>{{forloop.counter}}: {{item.text}}</td></tr>
			{% endfor %}
		</table>
	</body>
</html>
